[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nli_mcp_server"
version = "0.1.0"
description = "MCP server for the National Library of Israel APIs"
readme = "README.md"
authors = [
    {name = "Reinier Doelman", email = "rdoelman@users.noreply.github.com"}
]
license = {text = "MIT License"}
requires-python = ">=3.10"
dependencies = [
    "asyncio>=3.4.3",
    "httpx",
    "mcp>=1.6.0",
    "typer>=0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/nli_mcp_server"
"Bug Tracker" = "https://github.com/yourusername/nli_mcp_server/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.6",
]
